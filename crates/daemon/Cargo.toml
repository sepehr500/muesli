[package]
name = "muesli-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "muesli-daemon"
path = "src/main.rs"

[features]
default = ["aec"]
aec = ["muesli-audio/aec"]
aec-bundled = ["muesli-audio/aec-bundled"]

[dependencies]
muesli-core.workspace = true
muesli-audio = { workspace = true, default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pipewire = "0.10"
